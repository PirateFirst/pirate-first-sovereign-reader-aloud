name: Build Pirate First Reader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q PirateFirst_SovereignReader_Android_Project_JVM17.zip
          ls -la PirateFirstSovereignReader

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          gradle -p PirateFirstSovereignReader :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pirate-First-Sovereign-Reader
          path: PirateFirstSovereignReader/app/build/outputs/apk/debug/*.apk
