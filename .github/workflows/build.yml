name: BUILD V6.7 FINAL APK

on:
  workflow_dispatch:

jobs:
  build-v6-6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate V6.7 source ZIP
        run: |
          # Canonical source — exact filename, no glob, no filesystem-order selection.
          ZIP="PirateFirst_SovereignReader_V6_7_LighterTeal_VoiceMemory_Surgical.zip"
          EXPECTED_SHA256="7782992fedd90c57f91f4743f648d3a48c8f3ecfda2b29ed633028d83c6d5cbf"

          # Fail immediately if the canonical ZIP is absent.
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Canonical source ZIP not found: $ZIP"
            echo "Do not substitute another ZIP. Add the correct file and re-run."
            exit 1
          fi

          # Fail if multiple V6.7 ZIPs exist — prevents silent wrong-file selection.
          V67_COUNT=$(ls PirateFirst_SovereignReader_V6_7*.zip 2>/dev/null | wc -l)
          if [ "$V67_COUNT" -gt 1 ]; then
            echo "ERROR: Multiple V6.7 ZIPs found in repository root:"
            ls PirateFirst_SovereignReader_V6_7*.zip
            echo "Remove all except $ZIP and re-run."
            exit 1
          fi

          # Verify SHA-256 of the canonical ZIP before doing anything else.
          ACTUAL_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Source ZIP:      $ZIP"
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Actual   SHA256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA-256 mismatch — ZIP file is not the verified Surgical source."
            exit 1
          fi
          echo "SHA-256 verified."

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V6.7 source safely
        run: |
          rm -rf build-source
          mkdir -p build-source

          python3 - <<'PY'
          import os
          import zipfile

          zip_path = os.environ["SOURCE_ZIP"]
          destination = "build-source"

          print(f"Extracting: {zip_path}")

          with zipfile.ZipFile(zip_path, "r") as z:
              for member in z.infolist():
                  # Remove leading / characters so absolute ZIP paths
                  # cannot escape the extraction directory.
                  name = member.filename.lstrip("/")

                  if not name:
                      continue

                  target = os.path.normpath(
                      os.path.join(destination, name)
                  )

                  root = os.path.abspath(destination)
                  target_abs = os.path.abspath(target)

                  if not (
                      target_abs == root
                      or target_abs.startswith(root + os.sep)
                  ):
                      raise RuntimeError(
                          f"Unsafe archive path rejected: {member.filename}"
                      )

                  if member.is_dir():
                      os.makedirs(target_abs, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target_abs), exist_ok=True)
                      with z.open(member) as src, open(target_abs, "wb") as dst:
                          dst.write(src.read())

          print("Extraction completed successfully.")
          PY

          echo "Extracted project tree:"
          find build-source -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        run: |
          PROJECT="$(find build-source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project:"
          echo "$PROJECT"

      - name: Verify V6.7 source before building
        run: |
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/assets/index.html"
          echo "V6.7 SOURCE VERIFIED"
          echo "versionCode = 67"
          echo "versionName = 6.7"
          echo "index.html present"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build V6.7 APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify actual APK
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Create final V6.7 APK ZIP
        run: |
          mkdir -p release

          cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" \
            release/PirateFirst_SovereignReader_V6_7.apk

          cd release

          zip -9 PirateFirst_SovereignReader_V6_7_APK_FINAL.zip \
            PirateFirst_SovereignReader_V6_7.apk

          ls -lh PirateFirst_SovereignReader_V6_7_APK_FINAL.zip

      - name: Upload V6.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: PirateFirst_SovereignReader_V6_7_APK_FINAL
          path: release/PirateFirst_SovereignReader_V6_7_APK_FINAL.zip
          if-no-files-found: error
