name: Build Pirate First Reader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PirateFirst_SovereignReader_V6_5_Roman_Voices_GoldFleur.zip'
      - '.github/workflows/build-v6.5.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V6.5 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V6.5 source
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q "PirateFirst_SovereignReader_V6_5_Roman_Voices_GoldFleur.zip" -d build-source
          test -f build-source/PirateFirstSovereignReader/app/build.gradle.kts
          grep -q 'versionName = "6.5"' build-source/PirateFirstSovereignReader/app/build.gradle.kts
          grep -q 'versionCode = 65' build-source/PirateFirstSovereignReader/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         gradle-version: '8.13'
      - name: Build V6.5 APK
        working-directory: build-source/PirateFirstSovereignReader
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK is V6.5
        run: |
          APK="build-source/PirateFirstSovereignReader/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "Built APK: $APK"
          ls -lh "$APK"

      - name: Package V6.5 APK
        run: |
          mkdir -p release
          cp build-source/PirateFirstSovereignReader/app/build/outputs/apk/debug/app-debug.apk release/
          cd release
          zip -9 PirateFirst_SovereignReader_V6_5_APK.zip app-debug.apk
          unzip -l PirateFirst_SovereignReader_V6_5_APK.zip

      - name: Upload V6.5 APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PirateFirst_SovereignReader_V6_5_APK
          path: release/PirateFirst_SovereignReader_V6_5_APK.zip
          if-no-files-found: error
